<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Donanım ajanı için renk tonu seçenekleri</title>
  <desc id="desc">Dört renk teması yan yana gösterilmiştir: Derin Lacivert, Kömür Mavisi, Koyu Petrol ve Sıcak Obsidyen.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#06111a" flood-opacity=".16"/></filter>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.title{font-size:32px;font-weight:700}.sub{font-size:16px}.name{font-size:20px;font-weight:700}.tag{font-size:12px;font-weight:700;letter-spacing:1.2px}.body{font-size:13px}.tiny{font-size:10px}.btn{font-size:12px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#eef3f5"/>
  <text x="85" y="88" class="t title" fill="#183444">Hangi atmosfer sana daha yakın?</text>
  <text x="85" y="122" class="t sub" fill="#617b88">Aşağıdaki dört rengin her biri aynı mühendislik sohbet ekranında böyle görünür.</text>

  <!-- 1 Deep Navy -->

    <rect width="335" height="720" rx="18" fill="#0b1220"/>
    <rect x="16" y="16" width="303" height="74" rx="10" fill="#111d31"/>
    <circle cx="43" cy="43" r="14" fill="#7dd3fc"/><path d="M37 43h12M43 37v12" stroke="#0b1220" stroke-width="2"/>
    <text x="67" y="41" class="t name" fill="#eef8ff">Derin Lacivert</text><text x="67" y="61" class="mono tiny" fill="#94b8ca">TEKNİK • SAKİN • GÜVENLİ</text>
    <rect x="16" y="110" width="303" height="41" rx="8" fill="#152642" stroke="#7dd3fc" stroke-opacity=".34"/><text x="31" y="136" class="t btn" fill="#d9f7ff">+ Yeni mühendislik sohbeti</text>
    <text x="19" y="185" class="mono tag" fill="#799db0">BUGÜN</text><line x1="77" y1="181" x2="300" y2="181" stroke="#294258"/>
    <circle cx="33" cy="222" r="15" fill="#163354" stroke="#7dd3fc"/><text x="57" y="218" class="t body" fill="#d8e9f2">Donanım &amp; TinyML Mühendisi</text><text x="57" y="238" class="t tiny" fill="#9eb9c7">Bağlantıları ve güç bütçesini hazırladım.</text>
    <rect x="61" y="270" width="238" height="76" rx="10" fill="#1b293e"/><text x="77" y="298" class="t body" fill="#f0f8fb">ESP32 ile motor sürücü tasarla.</text><text x="77" y="319" class="t tiny" fill="#9eb0bc">Pin eşlemesi ve kod da olsun.</text>
    <rect x="19" y="378" width="281" height="186" rx="9" fill="#101a2a" stroke="#355775"/><text x="37" y="407" class="t name" fill="#ddf7ff">Teknik rapor</text><text x="37" y="428" class="mono tiny" fill="#89afc2">MİMARİ • DRC • KOD • BOM</text><line x1="37" y1="446" x2="282" y2="446" stroke="#29475e"/><rect x="37" y="463" width="113" height="54" fill="#14263d"/><rect x="159" y="463" width="113" height="54" fill="#14263d"/><text x="47" y="482" class="mono tiny" fill="#87b8cb">HEDEF MCU</text><text x="47" y="503" class="mono body" fill="#bdf2ff">ESP32-S3</text><text x="169" y="482" class="mono tiny" fill="#87b8cb">BELLEK</text><text x="169" y="503" class="mono body" fill="#bdf2ff">520 KB</text><text x="37" y="544" class="t body" fill="#d1e2ea">Mimari doğrulandı, 2 uyarı var.</text>
